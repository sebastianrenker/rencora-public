<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENCORA SETUP</title>
<style>
  :root{ --cy:#38e6ff; --cy2:#0a9dff; --pp:#b06bff; --dim:#5a6a80; --bg:#04070e; --ok:#5ef2a0; --ink:#dbe9ff; }
  *{box-sizing:border-box;} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Consolas','SF Mono','Courier New',monospace;display:flex;align-items:center;justify-content:center;}
  .card{width:min(460px,92vw);background:rgba(10,16,30,.6);border:1px solid rgba(56,230,255,.28);border-radius:16px;
    padding:30px 28px;box-shadow:0 0 40px rgba(10,157,255,.12);}
  h1{font-size:24px;letter-spacing:10px;margin:0 0 4px;color:#fff;text-shadow:0 0 16px var(--cy2);text-align:center;}
  .sub{text-align:center;color:var(--dim);font-size:11px;letter-spacing:4px;margin-bottom:22px;}
  label{display:block;font-size:11px;letter-spacing:2px;color:var(--cy);margin:16px 0 6px;text-transform:uppercase;}
  input{width:100%;background:rgba(8,20,36,.7);border:1px solid rgba(56,230,255,.3);border-radius:9px;color:#fff;
    font-family:inherit;font-size:15px;padding:12px 14px;outline:none;}
  input:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(56,230,255,.3);}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5;}
  .hint a{color:var(--cy);}
  .status{font-size:12px;margin:14px 0 0;letter-spacing:1px;}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:8px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);} .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  button{width:100%;margin-top:24px;background:linear-gradient(90deg,var(--pp),var(--cy2));border:none;border-radius:10px;
    color:#04101c;font-family:inherit;font-size:15px;letter-spacing:3px;padding:14px;cursor:pointer;font-weight:700;}
  button:hover{box-shadow:0 0 22px var(--cy);}
  #msg{text-align:center;margin-top:16px;font-size:13px;min-height:18px;}
  #msg.ok{color:var(--ok);} #msg.err{color:#ff6b6b;}
  .open{display:none;text-align:center;margin-top:14px;} .open a{color:var(--cy);letter-spacing:2px;font-size:13px;}
</style>
</head>
<body>
<div class="card">
  <h1>RENCORA</h1>
  <div class="sub">ERSTEINRICHTUNG</div>

  <label>Dein Name</label>
  <input id="name" placeholder="z.B. Max Mustermann" autocomplete="off">
  <div class="hint">Rencora spricht dich mit dem Vornamen an. Andere Nutzer tragen hier einfach ihren eigenen Namen ein.</div>

  <label>Gemini API-Key</label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false">
  <div class="hint">Kostenlos bei <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> holen. Wird nur lokal auf deinem PC gespeichert.</div>
  <div class="row"><span class="dot" id="keydot"></span><span id="keystate">Kein Key gespeichert</span></div>

  <button id="save">SPEICHERN</button>
  <div id="msg"></div>
  <div class="open" id="openrow"><a href="/local?to=%2Fhome">→ Rencora öffnen</a></div>
</div>

<script>
async function loadStatus(){
  try{ const s=await fetch('/api/setup-status').then(r=>r.json());
    if(s.name) document.getElementById('name').value=s.name;
    const dot=document.getElementById('keydot'), st=document.getElementById('keystate');
    if(s.has_key){ dot.classList.add('ok'); st.textContent='Key ist eingerichtet'; }
    else { dot.classList.remove('ok'); st.textContent='Kein Key gespeichert'; }
  }catch{}
}
loadStatus();
document.getElementById('save').addEventListener('click',async ()=>{
  const name=document.getElementById('name').value.trim();
  const key=document.getElementById('key').value.trim();
  const msg=document.getElementById('msg'); msg.className=''; msg.textContent='Speichere…';
  const body={}; if(name) body.name=name; if(key) body.gemini_api_key=key;
  if(!name && !key){ msg.className='err'; msg.textContent='Bitte Name oder Key eingeben.'; return; }
  try{ const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){ msg.className='ok'; msg.textContent='Gespeichert. Starte Rencora neu, damit alles greift.';
      document.getElementById('key').value=''; document.getElementById('openrow').style.display='block'; loadStatus(); }
    else { msg.className='err'; msg.textContent=d.error||'Fehler beim Speichern.'; }
  }catch(e){ msg.className='err'; msg.textContent='Verbindungsfehler.'; }
});
</script>
</body>
</html>
